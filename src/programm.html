<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programm</title>
    <meta
      name="description"
      content="Das vollständige Programm des CyberSummit 2027."
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand"
          >Cyber<strong>Summit</strong> <span class="brand-year">2027</span></a
        >
        <nav class="main-nav">
          <a href="/streams">Streams</a>
          <a href="/programm">Programm</a>
          <a href="/speakers">Speaker</a>
          <a href="/sponsoren">Sponsoren &amp; Partner</a>
          <a href="/kontakt">Kontakt</a>
          <a href="/faq">FAQ</a>
        </nav>
        <div class="header-actions">
          <nav class="lang-switch" aria-label="Sprache">
            <sv-langswitch>
              <template
                ><a data-bind="url" class="lang"
                  ><span data-bind="code"></span></a
              ></template>
            </sv-langswitch>
          </nav>
          <a href="/shop" class="btn btn-primary" data-sv-field="nav.tickets"
            >Warteliste 2027</a
          >
        </div>
      </div>
    </header>

    <section class="detail">
      <div class="container">
        <p class="eyebrow">Programm</p>
        <h1 data-sv-field="programm.title">Programm 2027</h1>
        <p
          style="color: var(--muted); max-width: 620px"
          data-sv-field="programm.intro"
        >
          Drei Tage, zwei Bühnen, über 40 Sessions. Klick auf eine Session für
          Details.
        </p>

        <!--
          EINE <sv-agenda> für das ganze Programm: group="day" baut die Tage aus den Daten.
          Tabs mit demselben Datum (parallele Workshops) werden EIN Tag, jeder Tab bleibt als
          Spur in `tracks` erhalten. Nie day="1|2|3" hart verdrahten — `day` ist ein Tab-Index
          und verliert still jeden Tab, den das Markup nicht kennt.

          data-bind-attr legt die ROHWERTE zusätzlich ins DOM. `data-bind` schreibt
          anzeigefertig ("11:00"), daraus kann eigenes JS keine Position berechnen — eine
          Timetable braucht den Instant. Beides auf demselben Element ist erlaubt.
        -->
        <sv-agenda group="day">
          <template>
            <section class="agenda-day" data-bind-attr="data-day:dayDate">
              <h2>
                Tag <span data-bind="dayNumber"></span
                ><span data-sv-show="dayDate">
                  · <span data-bind="dayDate" data-format="date"></span
                ></span>
              </h2>
              <p class="agenda-tracks" data-sv-show="hasTracks">
                Parallel:
                <sv-each field="tracks">
                  <template
                    ><span class="track" data-bind="name"></span
                  ></template>
                </sv-each>
              </p>
              <sv-each field="entries">
                <template>
                  <div
                    class="slot"
                    data-bind-attr="data-start:date, data-end:dateEnd, data-stage:stage, data-track:dayName"
                  >
                    <time data-bind="date" data-format="time"></time>
                    <div>
                      <h4>
                        <a data-bind="url"><span data-bind="topic"></span></a>
                      </h4>
                      <div class="meta">
                        <span data-bind="stage"></span> ·
                        <span data-bind="type" data-join=", "></span>
                      </div>
                      <sv-each field="speakers">
                        <template>
                          <span class="spk"
                            ><img data-bind="image" alt="" /><span
                              data-bind="name"
                            ></span
                          ></span>
                        </template>
                      </sv-each>
                    </div>
                  </div>
                </template>
              </sv-each>
            </section>
          </template>
          <template slot="empty"><p>Programm folgt.</p></template>
        </sv-agenda>
      </div>
    </section>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p class="footer-copy" data-sv-field="footer.copyright">
          © 2027 CyberSummit GmbH. Alle Rechte vorbehalten.
        </p>
        <nav class="footer-nav">
          <a href="/faq">FAQ</a>
          <a href="/kontakt">Kontakt</a>
          <a
            href="https://example.com/impressum"
            data-sv-field="footer.imprint"
            data-sv-type="link"
            >Impressum</a
          >
        </nav>
      </div>
    </footer>
  </body>
</html>
