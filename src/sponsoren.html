<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sponsoren &amp; Partner</title>
    <meta
      name="description"
      content="Die Sponsoren und Partner des CyberSummit 2027."
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand"
          >Cyber<strong>Summit</strong> <span class="brand-year">2027</span></a
        >
        <nav class="main-nav">
          <a href="/streams">Streams</a>
          <a href="/programm">Programm</a>
          <a href="/speakers">Speaker</a>
          <a href="/sponsoren">Sponsoren &amp; Partner</a>
          <a href="/kontakt">Kontakt</a>
          <a href="/faq">FAQ</a>
        </nav>
        <div class="header-actions">
          <nav class="lang-switch" aria-label="Sprache">
            <sv-langswitch>
              <template
                ><a data-bind="url" class="lang"
                  ><span data-bind="code"></span></a
              ></template>
            </sv-langswitch>
          </nav>
          <a href="/shop" class="btn btn-primary" data-sv-field="nav.tickets"
            >Warteliste 2027</a
          >
        </div>
      </div>
    </header>

    <section class="detail">
      <div class="container">
        <p class="eyebrow">Partner</p>
        <h1 data-sv-field="sponsors.pageTitle">Sponsoren &amp; Partner</h1>

        <!-- Nach Kategorie gruppiert: <sv-sponsors group="category"> -->
        <sv-sponsors group="category">
          <template>
            <div style="margin-top: 40px">
              <h2 data-bind="name"></h2>
              <div class="grid grid-3" style="margin-top: 18px">
                <sv-each field="sponsors">
                  <template>
                    <a class="card" data-bind="website">
                      <img
                        data-bind="logoUrl"
                        alt=""
                        style="max-height: 44px; margin-bottom: 12px"
                      />
                      <h3 style="margin: 0 0 4px" data-bind="name"></h3>
                      <p
                        style="margin: 0; color: var(--muted)"
                        data-bind="description"
                      ></p>
                    </a>
                  </template>
                </sv-each>
              </div>
            </div>
          </template>
          <template slot="empty"
            ><p>Partner werden bekanntgegeben.</p></template
          >
        </sv-sponsors>

        <div class="cta-band" style="margin-top: 56px">
          <h2 data-sv-field="sponsors.ctaTitle">Partner werden</h2>
          <a href="/kontakt" class="btn">Kontakt aufnehmen</a>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p class="footer-copy" data-sv-field="footer.copyright">
          © 2027 CyberSummit GmbH. Alle Rechte vorbehalten.
        </p>
        <nav class="footer-nav">
          <a href="/faq">FAQ</a>
          <a href="/kontakt">Kontakt</a>
          <a
            href="https://example.com/impressum"
            data-sv-field="footer.imprint"
            data-sv-type="link"
            >Impressum</a
          >
        </nav>
      </div>
    </footer>
  </body>
</html>
