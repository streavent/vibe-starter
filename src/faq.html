<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQ</title>
    <meta name="description" content="Häufige Fragen zum CyberSummit 2027." />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand"
          >Cyber<strong>Summit</strong> <span class="brand-year">2027</span></a
        >
        <nav class="main-nav">
          <a href="/streams">Streams</a>
          <a href="/programm">Programm</a>
          <a href="/speakers">Speaker</a>
          <a href="/sponsoren">Sponsoren &amp; Partner</a>
          <a href="/kontakt">Kontakt</a>
          <a href="/faq">FAQ</a>
        </nav>
        <div class="header-actions">
          <nav class="lang-switch" aria-label="Sprache">
            <sv-langswitch>
              <template
                ><a data-bind="url" class="lang"
                  ><span data-bind="code"></span></a
              ></template>
            </sv-langswitch>
          </nav>
          <a href="/shop" class="btn btn-primary" data-sv-field="nav.tickets"
            >Warteliste 2027</a
          >
        </div>
      </div>
    </header>

    <section class="detail">
      <div class="container" style="max-width: 760px">
        <p class="eyebrow">FAQ</p>
        <h1 data-sv-field="faq.title">Häufige Fragen</h1>

        <!--
          Eine eigene Collection: der Kunde legt Fragen selbst an, löscht sie und sortiert
          sie um — ohne dass jemand diese Seite anfasst. Das Schema steht in
          streavent.config.json, die Startdaten in src/collections/faq.json.
        -->
        <div style="margin-top: 24px">
          <sv-collection name="faq">
            <template>
              <div class="faq-item">
                <h3 data-bind="question"></h3>
                <p data-bind="answer"></p>
              </div>
            </template>
            <template slot="empty">
              <p>Fragen? Schreib uns über das <a href="/kontakt">Kontaktformular</a>.</p>
            </template>
          </sv-collection>
        </div>

        <h2 style="margin-top: 56px">Nur zu Tickets</h2>
        <p style="color: var(--muted)">
          Die häufigsten Fragen rund um Buchung und Umschreibung.
        </p>
        <!--
          Derselbe Datenbestand, ein Ausschnitt daraus: `filter="topic:Tickets"` zeigt nur
          die Einträge, deren Feld `topic` passt. Groß-/Kleinschreibung und Leerzeichen
          sind egal — die Werte tippt der Veranstalter im CMS.
        -->
        <div>
          <sv-collection name="faq" filter="topic:Tickets">
            <template>
              <div class="faq-item">
                <h3 data-bind="question"></h3>
                <p data-bind="answer"></p>
              </div>
            </template>
            <template slot="empty"><p>Keine Ticket-Fragen erfasst.</p></template>
          </sv-collection>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p class="footer-copy" data-sv-field="footer.copyright">
          © 2027 CyberSummit GmbH. Alle Rechte vorbehalten.
        </p>
        <nav class="footer-nav">
          <a href="/faq">FAQ</a>
          <a href="/kontakt">Kontakt</a>
          <a
            href="https://example.com/impressum"
            data-sv-field="footer.imprint"
            data-sv-type="link"
            >Impressum</a
          >
        </nav>
      </div>
    </footer>
  </body>
</html>
