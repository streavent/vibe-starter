<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speaker</title>
    <meta name="description" content="Die Speaker des CyberSummit 2027." />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand"
          >Cyber<strong>Summit</strong> <span class="brand-year">2027</span></a
        >
        <nav class="main-nav">
          <a href="/programm">Programm</a>
          <a href="/speakers">Speaker</a>
          <a href="/sponsoren">Sponsoren &amp; Partner</a>
          <a href="/kontakt">Kontakt</a>
          <a href="/faq">FAQ</a>
        </nav>
        <div class="header-actions">
          <nav class="lang-switch" aria-label="Sprache">
            <sv-langswitch>
              <template
                ><a data-bind="url" class="lang"
                  ><span data-bind="code"></span></a
              ></template>
            </sv-langswitch>
          </nav>
          <a href="/shop" class="btn btn-primary" data-sv-field="nav.tickets"
            >Warteliste 2027</a
          >
        </div>
      </div>
    </header>

    <section class="detail">
      <div class="container">
        <p class="eyebrow">Speaker</p>
        <h1 data-sv-field="speakers.pageTitle">Unsere Speaker</h1>
        <div class="grid grid-4" style="margin-top: 32px">
          <sv-speakers sort="name">
            <template>
              <a class="card speaker-card" data-bind="url">
                <img data-bind="image" alt="" />
                <h3 data-bind="name"></h3>
                <div class="role" data-bind="position"></div>
                <div class="org" data-bind="company"></div>
              </a>
            </template>
            <template slot="empty"
              ><p>Speaker werden bald bekanntgegeben.</p></template
            >
          </sv-speakers>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p class="footer-copy" data-sv-field="footer.copyright">
          © 2027 CyberSummit GmbH. Alle Rechte vorbehalten.
        </p>
        <nav class="footer-nav">
          <a href="/faq">FAQ</a>
          <a href="/kontakt">Kontakt</a>
          <a
            href="https://example.com/impressum"
            data-sv-field="footer.imprint"
            data-sv-type="link"
            >Impressum</a
          >
        </nav>
      </div>
    </footer>
  </body>
</html>
